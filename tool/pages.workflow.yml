name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web
        run: |
          flutter build web \
            --release \
            --base-href "/${{ github.event.repository.name }}/" \
            --no-web-resources-cdn

      - name: Stamp service worker + .nojekyll
        run: |
          test -f build/web/sw.js || { echo "sw.js 未随构建产出"; exit 1; }
          sed -i "s/__BUILD_ID__/${GITHUB_SHA::12}/" build/web/sw.js
          # Flutter 自带的 SW 已弃用且会自我注销，交给 web/sw.js，删除以免混淆
          rm -f build/web/flutter_service_worker.js
          touch build/web/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
